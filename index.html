<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyline">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<title>Skyline — live traffic scope</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0D0F;
    --bg-panel:#0E1316;
    --bg-scope:#071410;
    --line:#1B2622;
    --phosphor:#5EEBA5;
    --phosphor-dim:#2A5C46;
    --phosphor-faint:#173229;
    --amber:#FFB347;
    --text-primary:#D7E4DD;
    --text-secondary:#7C9C8E;
    --text-tertiary:#4C635A;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;background:var(--bg-deep);
    font-family:'Inter',sans-serif;color:var(--text-primary);
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100%;
  }

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:18px;
    padding:10px 16px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    z-index:20;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:baseline;gap:8px;flex-shrink:0;
  }
  .brand .mark{color:var(--phosphor);font-size:18px;}
  .brand h1{
    font-size:15px;font-weight:600;letter-spacing:0.02em;margin:0;
    color:var(--text-primary);
  }
  .brand .sub{
    font-size:11px;color:var(--text-tertiary);
  }
  #search{
    flex:1;max-width:280px;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 10px;
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  #search::placeholder{color:var(--text-tertiary);}
  #search:focus{outline:none;border-color:var(--phosphor-dim);}

  .region-group{display:flex;gap:4px;}
  .region-btn{
    background:transparent;border:1px solid var(--line);
    color:var(--text-secondary);
    padding:6px 11px;border-radius:4px;
    font-size:12px;font-family:'Inter',sans-serif;
    cursor:pointer;transition:border-color .15s, color .15s;
  }
  .region-btn:hover{border-color:var(--phosphor-dim);color:var(--text-primary);}
  .region-btn.active{
    border-color:var(--phosphor);color:var(--phosphor);
    background:var(--phosphor-faint);
  }
  .region-btn.locate{
    display:flex;align-items:center;gap:5px;
  }
  .region-btn.locate svg{width:12px;height:12px;flex-shrink:0;}

  #status{
    margin-left:auto;display:flex;align-items:center;gap:16px;
    font-size:11.5px;color:var(--text-secondary);
    font-family:'IBM Plex Mono',monospace;
    flex-shrink:0;
  }
  .status-item{display:flex;align-items:center;gap:6px;}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-tertiary);
    flex-shrink:0;
  }
  .dot.live{background:var(--phosphor);box-shadow:0 0 6px var(--phosphor);animation:pulse 2s infinite;}
  .dot.err{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- main layout ---------- */
  #main{
    display:grid;
    grid-template-columns:1fr 320px;
    min-height:0;
  }
  #scope-wrap{
    position:relative;min-width:0;
    background:var(--bg-scope);
  }
  #map{height:100%;width:100%;background:var(--bg-scope);}

  .leaflet-container{background:var(--bg-scope) !important;}
  .leaflet-layer.basemap-dark{
    filter:invert(1) hue-rotate(175deg) brightness(0.85) contrast(0.92) saturate(0.6);
  }
  .leaflet-control-attribution{
    background:rgba(10,13,15,.7) !important;
    color:var(--text-tertiary) !important;
    font-size:9.5px !important;
  }
  .leaflet-control-attribution a{color:var(--text-secondary) !important;}
  .leaflet-control-zoom a{
    background:var(--bg-panel) !important;
    color:var(--text-primary) !important;
    border-color:var(--line) !important;
  }

  .plane-icon{
    filter:drop-shadow(0 0 3px rgba(94,235,165,.55));
    transition:transform .4s linear;
  }
  .plane-icon.selected{filter:drop-shadow(0 0 5px rgba(255,179,71,.85));}

  #scope-footer{
    position:absolute;left:14px;bottom:12px;z-index:15;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--text-tertiary);
    background:rgba(7,20,16,.7);
    padding:5px 9px;border-radius:4px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  #scope-error{
    position:absolute;left:14px;top:12px;right:14px;z-index:15;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    color:var(--danger);
    background:rgba(7,20,16,.85);
    padding:8px 11px;border-radius:4px;
    border:1px solid rgba(255,107,107,.35);
    display:none;
  }
  #scope-error.show{display:block;}

  /* ---------- sidebar ---------- */
  #sidebar{
    background:var(--bg-panel);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  #list-head{
    padding:12px 14px 8px;
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  #list-head h2{
    font-size:11.5px;font-weight:600;letter-spacing:.04em;
    margin:0;color:var(--text-secondary);
    text-transform:uppercase;
  }
  #list-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--phosphor);}

  #flight-list{
    overflow-y:auto;flex:1;min-height:0;
  }
  #flight-list::-webkit-scrollbar{width:6px;}
  #flight-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .flight-row{
    padding:9px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    transition:background .12s;
  }
  .flight-row:hover{background:rgba(94,235,165,.05);}
  .flight-row.selected{background:rgba(255,179,71,.08);border-left:2px solid var(--amber);}
  .flight-row .callsign{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
    color:var(--text-primary);
  }
  .flight-row .subline{font-size:10.5px;color:var(--text-tertiary);margin-top:2px;}
  .flight-row .metrics{
    text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:var(--text-secondary);
  }
  .flight-row .metrics .alt{color:var(--phosphor);}

  .empty-state{
    padding:40px 20px;text-align:center;
    color:var(--text-tertiary);font-size:12.5px;line-height:1.6;
  }

  /* ---------- detail panel ---------- */
  #detail{
    border-top:1px solid var(--line);
    padding:16px;flex-shrink:0;
    display:none;
  }
  #detail.open{display:block;}
  #detail .dcall{
    font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;
    color:var(--amber);margin-bottom:2px;
  }
  #detail .dcountry{font-size:11.5px;color:var(--text-tertiary);margin-bottom:12px;}
  .dgrid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
  }
  .dgrid .stat-label{
    font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--text-tertiary);margin-bottom:2px;
  }
  .dgrid .stat-val{
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--text-primary);
  }
  #detail-close{
    float:right;background:none;border:none;color:var(--text-tertiary);
    cursor:pointer;font-size:16px;line-height:1;padding:0;
  }
  #detail-close:hover{color:var(--text-primary);}

  /* ---------- mobile layout ---------- */
  #sheet-handle{ display:none; }
  @media (max-width:760px){
    body{ -webkit-tap-highlight-color:transparent; }

    #topbar{
      padding:8px 10px 8px;
      gap:6px;
      flex-wrap:wrap;
    }
    .brand .sub{ display:none; }
    #search{
      order:3; flex:1 1 100%; max-width:none;
      padding:10px 12px; font-size:14px; /* avoids iOS auto-zoom on focus */
    }
    .region-group{
      order:2; flex:1 1 auto; min-width:0;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; padding-bottom:2px;
    }
    .region-group::-webkit-scrollbar{ display:none; }
    .region-btn{
      flex:0 0 auto; white-space:nowrap;
      padding:9px 13px; font-size:13px;
    }
    #status{
      order:4; margin-left:0; flex:1 1 100%;
      justify-content:space-between;
    }

    #main{ grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; position:relative; }
    #scope-wrap{ min-height:0; }
    #scope-footer{ bottom:12px; }

    #sidebar{
      position:relative; /* not fixed — avoids iOS Safari's dynamic toolbar clipping fixed elements */
      max-height:64px;
      overflow:hidden;
      border-left:none; border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      box-shadow:0 -10px 30px rgba(0,0,0,.45);
      transition:max-height .3s cubic-bezier(.32,.72,0,1);
      z-index:30;
      padding-bottom:env(safe-area-inset-bottom);
    }
    #sidebar.expanded{ max-height:70vh; }

    #sheet-handle{
      display:flex; justify-content:center; align-items:center;
      padding:8px 0 4px; flex-shrink:0; cursor:pointer;
    }
    #sheet-handle .bar{
      width:36px; height:4px; border-radius:2px;
      background:var(--line);
    }

    #list-head{ cursor:pointer; padding:4px 14px 10px; }
    .flight-row{ padding:12px 14px; }
    .flight-row .callsign{ font-size:14px; }
    #detail-close{ padding:8px; margin:-8px -8px 0 0; font-size:18px; }
    .dgrid .stat-val{ font-size:14.5px; }

    .region-btn.locate{ padding:9px 12px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <span class="mark">◎</span>
      <h1>SKYLINE</h1>
      <span class="sub">live scope</span>
    </div>
    <input id="search" type="text" placeholder="filter callsign…" />
    <div class="region-group" id="regions"></div>
    <button class="region-btn locate" id="locate-btn" title="Zoom to my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      My location
    </button>
    <div id="status">
      <div class="status-item"><span class="dot" id="live-dot"></span><span id="live-text">connecting</span></div>
      <div class="status-item"><span id="updated-text">—</span></div>
    </div>
  </div>

  <div id="main">
    <div id="scope-wrap">
      <div id="map"></div>
      <div id="scope-error"></div>
      <div id="scope-footer"><span id="scope-footer-text">— aircraft in view</span></div>
    </div>

    <div id="sidebar">
      <div id="sheet-handle"><div class="bar"></div></div>
      <div id="list-head">
        <h2>Traffic</h2>
        <span id="list-count">0</span>
      </div>
      <div id="flight-list"><div class="empty-state">Waiting for data…</div></div>
      <div id="detail">
        <button id="detail-close">✕</button>
        <div class="dcall" id="d-call">—</div>
        <div class="dcountry" id="d-country">—</div>
        <div class="dgrid">
          <div><div class="stat-label">Altitude</div><div class="stat-val" id="d-alt">—</div></div>
          <div><div class="stat-label">Speed</div><div class="stat-val" id="d-speed">—</div></div>
          <div><div class="stat-label">Heading</div><div class="stat-val" id="d-heading">—</div></div>
          <div><div class="stat-label">Vert. rate</div><div class="stat-val" id="d-vrate">—</div></div>
          <div><div class="stat-label">Squawk</div><div class="stat-val" id="d-squawk">—</div></div>
          <div><div class="stat-label">Status</div><div class="stat-val" id="d-status">—</div></div>
          <div style="grid-column:1/-1"><div class="stat-label">Route</div><div class="stat-val" id="d-route">—</div></div>
          <div style="grid-column:1/-1"><div class="stat-label">Airline</div><div class="stat-val" id="d-airline">—</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){

  // ---------------- regions ----------------
  // adsb.lol's /v2/point endpoint takes a center + radius in nautical miles,
  // capped at 250nm, so each region is a single circular query around a hub.
  const REGIONS = {
    uk:     { label:'UK & Ireland', center:[54.0,-3.5],   zoom:6, radius:250 },
    europe: { label:'Central Europe', center:[49.5,8.0],  zoom:6, radius:250 },
    useast: { label:'US East',      center:[39.0,-77.0],  zoom:6, radius:250 },
    japan:  { label:'Japan',        center:[35.6,139.7],  zoom:6, radius:250 },
  };
  let currentRegion = 'uk';
  let selectedHex = null;
  let planeMarkers = {};   // hex -> marker
  let latestAircraft = []; // normalized array
  let filterText = '';
  const routeCache = {}; // callsign -> route lookup result, so repeat clicks don't refetch

  // ---------------- map setup ----------------
  const map = L.map('map', { zoomControl:true, attributionControl:true })
    .setView(REGIONS[currentRegion].center, REGIONS[currentRegion].zoom);

  // Standard OpenStreetMap tiles (no API key required), inverted via CSS to a
  // dark scope-style palette so we're not dependent on a keyed tile provider.
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors — traffic data: adsb.lol community network',
    subdomains:'abc', maxZoom:19,
    className:'basemap-dark'
  }).addTo(map);

  // radar range rings drawn around the region center, purely decorative context
  function drawRings(center){
    if(window._rings) window._rings.forEach(r=>map.removeLayer(r));
    window._rings = [];
    [2,4,6,8].forEach(deg=>{
      const ring = L.circle(center, { radius: deg*111000, color:'#2A5C46', weight:1, fill:false, opacity:.35, interactive:false });
      ring.addTo(map);
      window._rings.push(ring);
    });
  }
  drawRings(REGIONS[currentRegion].center);

  // ---------------- region buttons ----------------
  const regionBar = document.getElementById('regions');
  Object.keys(REGIONS).forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'region-btn' + (key===currentRegion ? ' active':'');
    btn.textContent = REGIONS[key].label;
    btn.onclick = ()=>{
      currentRegion = key;
      document.querySelectorAll('.region-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const r = REGIONS[key];
      map.setView(r.center, r.zoom);
      drawRings(r.center);
      fetchStates();
    };
    regionBar.appendChild(btn);
  });

  // ---------------- mobile bottom-sheet toggle ----------------
  const sidebar = document.getElementById('sidebar');
  function toggleSheet(){ sidebar.classList.toggle('expanded'); }
  function expandSheet(){ sidebar.classList.add('expanded'); }
  document.getElementById('sheet-handle').addEventListener('click', toggleSheet);
  document.getElementById('list-head').addEventListener('click', toggleSheet);

  // ---------------- locate me ----------------
  const locateBtn = document.getElementById('locate-btn');
  locateBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation){
      showError('This browser does not support location lookup.');
      return;
    }
    locateBtn.disabled = true;
    locateBtn.textContent = '';
    locateBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Locating…';
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        REGIONS.mine = { label:'My location', center:[latitude, longitude], zoom:9, radius:150 };
        currentRegion = 'mine';
        document.querySelectorAll('.region-btn:not(.locate)').forEach(b=>b.classList.remove('active'));
        map.setView(REGIONS.mine.center, REGIONS.mine.zoom);
        drawRings(REGIONS.mine.center);
        L.marker(REGIONS.mine.center, {
          icon: L.divIcon({ html:'<div style="width:10px;height:10px;border-radius:50%;background:#FFB347;box-shadow:0 0 8px #FFB347;border:2px solid #0A0D0F;"></div>', className:'', iconSize:[14,14], iconAnchor:[7,7] })
        }).addTo(map);
        fetchStates();
        resetLocateBtn();
      },
      err => {
        showError('Could not get your location — ' + (err.code === 1 ? 'permission was denied.' : 'the request failed or timed out.'));
        resetLocateBtn();
      },
      { enableHighAccuracy:false, timeout:10000 }
    );
  });
  function resetLocateBtn(){
    locateBtn.disabled = false;
    locateBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> My location';
  }

  // ---------------- plane icon ----------------
  function planeSvg(color){
    return `<svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1.5 L14.4 9.5 L22.5 13 L14.2 13.6 L15.5 20.5 L12 18.3 L8.5 20.5 L9.8 13.6 L1.5 13 L9.6 9.5 Z"
        fill="${color}" stroke="rgba(0,0,0,.35)" stroke-width="0.5"/>
    </svg>`;
  }

  function makeIcon(heading, isSelected){
    const color = isSelected ? '#FFB347' : '#5EEBA5';
    const html = `<div class="plane-icon${isSelected?' selected':''}" style="transform:rotate(${heading}deg)">${planeSvg(color)}</div>`;
    return L.divIcon({ html, className:'', iconSize:[22,22], iconAnchor:[11,11] });
  }

  // ---------------- status helpers ----------------
  const liveDot = document.getElementById('live-dot');
  const liveText = document.getElementById('live-text');
  const updatedText = document.getElementById('updated-text');
  const footerText = document.getElementById('scope-footer-text');
  const listCount = document.getElementById('list-count');
  const flightList = document.getElementById('flight-list');
  const scopeError = document.getElementById('scope-error');

  function setStatus(state, msg){
    liveDot.className = 'dot' + (state==='live' ? ' live' : state==='err' ? ' err' : '');
    liveText.textContent = msg;
  }
  function showError(msg){
    scopeError.textContent = msg;
    scopeError.classList.add('show');
  }
  function hideError(){
    scopeError.classList.remove('show');
  }

  // ---------------- data fetch ----------------
  // The local server (server.py) fetches adsb.lol itself and serves the
  // result from this same origin, so no cross-origin request — and no CORS
  // restriction — is involved here at all.
  async function fetchStates(){
    const r = REGIONS[currentRegion];
    const url = `/api/states?lat=${r.center[0]}&lon=${r.center[1]}&radius=${r.radius}`;
    setStatus('connecting', 'updating…');
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      latestAircraft = (data.ac || []).filter(a => typeof a.lat === 'number' && typeof a.lon === 'number');
      setStatus('live', 'live');
      hideError();
      updatedText.textContent = new Date().toLocaleTimeString();
      renderPlanes();
      renderList();
    }catch(err){
      setStatus('err', 'connection lost — retrying');
      showError('Could not reach the live data source. Retrying automatically.');
    }
  }

  function fmtAlt(v){
    if(v==null) return '—';
    if(v === 'ground') return 'ground';
    return Math.round(v).toLocaleString() + ' ft';
  }
  function fmtSpeed(kt){ return kt==null ? '—' : Math.round(kt) + ' kt'; }
  function fmtVrate(fpm){
    if(fpm==null) return '—';
    if(Math.abs(fpm) < 60) return 'level';
    return (fpm>0?'+':'') + Math.round(fpm) + ' fpm';
  }

  function renderPlanes(){
    const seen = new Set();
    latestAircraft.forEach(a=>{
      const hex = a.hex;
      const heading = a.track || 0;
      seen.add(hex);
      const isSel = hex === selectedHex;
      if(planeMarkers[hex]){
        planeMarkers[hex].setLatLng([a.lat, a.lon]);
        planeMarkers[hex].setIcon(makeIcon(heading, isSel));
      }else{
        const marker = L.marker([a.lat, a.lon], { icon: makeIcon(heading, isSel) });
        marker.on('click', ()=> selectFlight(hex));
        marker.addTo(map);
        planeMarkers[hex] = marker;
      }
    });
    Object.keys(planeMarkers).forEach(hex=>{
      if(!seen.has(hex)){
        map.removeLayer(planeMarkers[hex]);
        delete planeMarkers[hex];
      }
    });
  }

  function renderList(){
    let states = latestAircraft.slice();
    if(filterText){
      states = states.filter(a => (a.flight||'').toLowerCase().includes(filterText));
    }
    states.sort((a,b)=>{
      const av = typeof a.alt_baro === 'number' ? a.alt_baro : -1;
      const bv = typeof b.alt_baro === 'number' ? b.alt_baro : -1;
      return bv - av;
    });
    listCount.textContent = states.length;
    footerText.textContent = states.length + ' aircraft in view';

    if(states.length === 0){
      flightList.innerHTML = '<div class="empty-state">No aircraft matching current view.<br>Try another region or clear the filter.</div>';
      return;
    }

    flightList.innerHTML = '';
    states.forEach(a=>{
      const hex = a.hex;
      const call = (a.flight||'').trim() || '—';
      const sub = [a.r, a.t].filter(Boolean).join(' · ') || hex.toUpperCase();
      const row = document.createElement('div');
      row.className = 'flight-row' + (hex===selectedHex ? ' selected' : '');
      row.innerHTML = `
        <div>
          <div class="callsign">${call}</div>
          <div class="subline">${sub}</div>
        </div>
        <div class="metrics">
          <div class="alt">${fmtAlt(a.alt_baro)}</div>
          <div>${fmtSpeed(a.gs)}</div>
        </div>`;
      row.onclick = ()=> selectFlight(hex, true);
      flightList.appendChild(row);
    });
  }

  function selectFlight(hex, panTo){
    selectedHex = hex;
    expandSheet();
    const a = latestAircraft.find(x => x.hex === hex);
    renderPlanes();
    renderList();
    if(!a) return;
    const detail = document.getElementById('detail');
    detail.classList.add('open');
    document.getElementById('d-call').textContent = (a.flight||'').trim() || '—';
    document.getElementById('d-country').textContent = [a.r, a.t].filter(Boolean).join(' · ') || a.hex.toUpperCase();
    document.getElementById('d-alt').textContent = fmtAlt(a.alt_baro);
    document.getElementById('d-speed').textContent = fmtSpeed(a.gs);
    document.getElementById('d-heading').textContent = a.track!=null ? Math.round(a.track) + '°' : '—';
    document.getElementById('d-vrate').textContent = fmtVrate(a.baro_rate);
    document.getElementById('d-squawk').textContent = a.squawk || '—';
    document.getElementById('d-status').textContent = a.alt_baro === 'ground' ? 'on ground' : 'airborne';
    if(panTo) map.panTo([a.lat, a.lon]);
    lookupRoute((a.flight||'').trim(), hex);
  }

  function lookupRoute(callsign, forHex){
    const dRoute = document.getElementById('d-route');
    const dAirline = document.getElementById('d-airline');
    if(!callsign){
      dRoute.textContent = '—';
      dAirline.textContent = '—';
      return;
    }
    if(routeCache[callsign]){
      applyRoute(routeCache[callsign], forHex);
      return;
    }
    dRoute.textContent = 'Looking up…';
    dAirline.textContent = 'Looking up…';
    fetch(`/api/route?callsign=${encodeURIComponent(callsign)}`)
      .then(r => r.json())
      .then(data => {
        routeCache[callsign] = data;
        applyRoute(data, forHex);
      })
      .catch(()=>{
        if(selectedHex !== forHex) return;
        dRoute.textContent = 'Lookup failed';
        dAirline.textContent = '—';
      });
  }

  function applyRoute(data, forHex){
    if(selectedHex !== forHex) return; // user selected something else while this was in flight
    const dRoute = document.getElementById('d-route');
    const dAirline = document.getElementById('d-airline');
    if(!data || !data.found || !data.route){
      dRoute.textContent = 'No route data available';
      dAirline.textContent = '—';
      return;
    }
    const r = data.route;
    const originName = r.origin ? (r.origin.iata_code || r.origin.icao_code || r.origin.name) : null;
    const destName = r.destination ? (r.destination.iata_code || r.destination.icao_code || r.destination.name) : null;
    dRoute.textContent = (originName && destName) ? `${originName} → ${destName}` : 'No route data available';
    dAirline.textContent = r.airline ? (r.airline.name || '—') : '—';
  }

  document.getElementById('detail-close').onclick = ()=>{
    selectedHex = null;
    document.getElementById('detail').classList.remove('open');
    document.getElementById('d-route').textContent = '—';
    document.getElementById('d-airline').textContent = '—';
    renderPlanes(); renderList();
  };

  document.getElementById('search').addEventListener('input', e=>{
    filterText = e.target.value.trim().toLowerCase();
    renderList();
  });

  // ---------------- polling ----------------
  fetchStates();
  setInterval(fetchStates, 12000);

})();
</script>
</body>
</html>
